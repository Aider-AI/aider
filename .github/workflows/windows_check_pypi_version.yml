name: Windows Check PyPI Version

# Check to be sure `pip install aider-chat` installs the most recently published version on Windows.
# If dependencies get yanked, it may render the latest version uninstallable.
# See https://github.com/Aider-AI/aider/issues/3699 for example.

on:
  pull_request:
    paths:
      - ".github/workflows/windows_check_pypi_version.yml"
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  check_version:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Published aider-chat support is Python >=3.10,<3.13.
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install aider-chat
        run: |
          python -m pip install --upgrade pip
          python -m pip install aider-chat

      - name: Get installed aider version
        id: installed_version
        run: |
          $ErrorActionPreference = "Stop"
          $aider_version_output = aider --version
          if ($LASTEXITCODE -ne 0) {
            throw "Error: 'aider --version' command failed."
          }
          Write-Host "Raw aider --version output: $aider_version_output"
          $match = [regex]::Match($aider_version_output, '\d+\.\d+\.\d+')
          if (-not $match.Success) {
            throw "Error: Could not extract version number from aider --version output."
          }
          "version=$($match.Value)" >> $env:GITHUB_OUTPUT

      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          $ErrorActionPreference = "Stop"
          git fetch --tags origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch tags."
          }
          $latest_tag = (git tag --sort=-v:refname | Select-String -Pattern '^v\d+\.\d+\.\d+$' | Select-Object -First 1).Line
          if (-not $latest_tag) {
            throw "Error: Could not find a stable vX.Y.Z tag."
          }
          $tag_num = $latest_tag.Substring(1)
          "tag=$tag_num" >> $env:GITHUB_OUTPUT

      - name: Compare versions
        run: |
          $installed = "${{ steps.installed_version.outputs.version }}"
          $latest = "${{ steps.latest_tag.outputs.tag }}"
          Write-Host "Installed version: $installed"
          Write-Host "Latest tag version: $latest"
          if ($installed -ne $latest) {
            throw "Installed aider version ($installed) does not match the latest stable source tag ($latest)."
          }
          Write-Host "Versions match."
